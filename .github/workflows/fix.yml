name: fix-names
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git ls-files | grep -E '(^|/)[0-9]+-' | while read -r f; do
            d=$(dirname "$f"); b=$(basename "$f" | sed 's/^[0-9]*-//')
            git mv -f "$f" "$d/$b"
          done
          git config user.name "sourav-bwn"
          git config user.email "souravgarai.bwn@gmail.com"
          git diff --cached --quiet || (git commit -m "Fix uploaded file names" && git push)
